<div class="secttl"><h2>プリントを作る</h2><span>範囲や問題数を選んで、PDF の保存・印刷</span></div>
<div class="wrap">
  <aside class="panel" aria-label="設定">
        <div class="grp"><b>出題範囲</b><div class="checks" id="cats"></div></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const CATS=[["pres","現在形・現在進行形"],["past","過去形・過去進行形"],["perf","現在完了（進行形）"],["plu","過去完了（進行形）"],["fut","未来・未来完了"],["adv","時・条件の副詞節"]];
const TYPES=[["mc","4 択"],["form","（ ）の動詞を適切な形に"],["err","下線部の誤りを直す"]];
// s: ___ が空所, v: 原形, a: 正解, d: 誤答（d[0] は誤り訂正で使う）, l: 1基礎 2標準 3入試, e: 解説
const B=[
 ["pres","My father usually ___ to work by bike.","go","goes",["is going","went","has gone"],1,"usually（ふだん）→ 習慣は現在形。主語が 3 人称単数なので goes。"],
 ["pres","Look! The children ___ in the park.","play","are playing",["play","played","have played"],1,"Look!（ほら）→ 今まさに途中の動作は現在進行形。"],
 ["pres","Water ___ at 100°C.","boil","boils",["is boiling","boiled","has boiled"],1,"いつでも変わらない事実（不変の真理）は現在形。"],
 ["pres","Be quiet! The baby ___ .","sleep","is sleeping",["sleeps","slept","has slept"],1,"「静かに！」→ 今眠っている途中なので現在進行形。"],
 ["pres","This bag ___ to my sister.","belong","belongs",["is belonging","are belonging","belong"],2,"belong（所属している）は状態動詞なので進行形にしない。3 単現の -s。"],
 ["pres","I ___ what you mean.","know","know",["am knowing","knows","have been knowing"],2,"know は状態動詞。進行形にしない。"],
 ["pres","The next train ___ at 10:15 tonight.","leave","leaves",["left","has left","had left"],2,"時刻表で決まっている予定（確定した未来）は現在形。"],
 ["pres","She ___ lunch with her friends right now.","have","is having",["has","had","has had"],3,"「食べる」の have は動作なので進行形にできる。right now → 現在進行形。"],
 ["past","I ___ my grandmother last Sunday.","visit","visited",["have visited","visit","had visited"],1,"last Sunday（過去の一点）→ 過去形。現在完了は使えない。"],
 ["past","When I called her, she ___ a bath.","take","was taking",["takes","took","has taken"],1,"電話したとき「途中だった」動作 → 過去進行形。"],
 ["past","He ___ to Kyoto three years ago.","move","moved",["has moved","had moved","moves"],1,"~ ago は過去の一点 → 過去形。"],
 ["past","What ___ you doing at eight last night?","be","were",["are","have been","did"],2,"昨夜 8 時に「何をしている途中だったか」→ 過去進行形 were ~ing。"],
 ["past","When ___ you finish your homework?","do","did",["have","had","do"],2,"When（いつ）は一点を聞くので現在完了は使えない。終えたのは過去 → did。"],
 ["past","While I ___ TV, the phone rang.","watch","was watching",["have watched","watched","watch"],2,"電話が鳴った間ずっと「見ている途中」→ 過去進行形。"],
 ["past","I ___ him just now.","see","saw",["have seen","had seen","see"],3,"just now（ついさっき）は過去の一点 → 過去形。just だけなら現在完了。"],
 ["past","It ___ heavily when I left home this morning.","rain","was raining",["has rained","rains","has been raining"],2,"家を出たとき「降っている途中」→ 過去進行形。"],
 ["perf","I ___ in Tokyo since 2015.","live","have lived",["live","lived","am living"],1,"since 2015（2015 年から今まで）→ 継続の現在完了。"],
 ["perf","She has just ___ her homework.","finish","finished",["finish","finishing","finishes"],1,"have / has の後ろは過去分詞。just → 完了の現在完了。"],
 ["perf","I ___ Mt. Fuji twice so far.","climb","have climbed",["climb","am climbing","had climbed"],2,"so far（今までに）＋回数 → 経験の現在完了。"],
 ["perf","We ___ each other for ten years.","know","have known",["know","are knowing","knew"],2,"for ten years（10 年間）→ 継続。know は状態動詞なので現在完了（進行形にしない）。"],
 ["perf","I ___ my key, so I can't open the door.","lose","have lost",["lose","had lost","am losing"],2,"なくして「今も見つかっていない」→ 結果の現在完了。"],
 ["perf","She ___ to Hawaii three times.","be","has been",["has gone","is","had gone"],2,"「行ったことがある」は have been to。has gone to は「行ってしまった（今いない）」。"],
 ["perf","It ___ since last night.","rain","has been raining",["rains","is raining","rained"],3,"since last night（昨夜から今まで）＋動作動詞 rain → 現在完了進行形。"],
 ["perf","My brother ___ to Canada. He isn't here now.","go","has gone",["goes","has been","had gone"],3,"「行ってしまって今ここにいない」→ has gone to。"],
 ["plu","By the time I got to the station, the train ___ .","leave","had left",["has left","leaves","will have left"],2,"駅に着いた（過去）より前に出発 → 大過去の had + 過去分詞。"],
 ["plu","I lost the watch my father ___ me.","give","had given",["has given","gives","will give"],2,"なくした（過去）より前にもらった → 過去完了。"],
 ["plu","When we arrived, the party ___ already.","start","had started",["has started","starts","will start"],2,"到着した（過去）時点でもう始まっていた → 過去完了。"],
 ["plu","She ___ in Paris for five years before she moved to London.","live","had lived",["has lived","lives","will have lived"],3,"引っ越した（過去）時点まで 5 年間続いた → 過去完了（継続）。"],
 ["plu","He said that he ___ the movie before.","see","had seen",["has seen","sees","will have seen"],3,"said（過去）の時点より前の経験 → 過去完了（時制の一致）。"],
 ["plu","They ___ for two hours when the bus finally came.","wait","had been waiting",["have been waiting","are waiting","wait"],3,"バスが来た（過去）時点まで 2 時間ずっと待っていた → 過去完了進行形。"],
 ["fut","I ___ you tomorrow.","call","will call",["called","have called","had called"],1,"tomorrow（明日）→ 未来の will。"],
 ["fut","My sister ___ 18 next year.","be","will be",["was","has been","had been"],1,"next year（来年）→ will be。"],
 ["fut","The concert ___ at 7 p.m. tomorrow.","start","starts",["started","has started","had started"],2,"予定表で決まっている予定は現在形で未来を表せる。"],
 ["fut","I ___ my homework by six o'clock.","finish","will have finished",["had finished","finish","finished"],2,"by six（6 時までに）→ 未来の時点までの完了 → 未来完了。"],
 ["fut","This time tomorrow, we ___ over the Pacific.","fly","will be flying",["fly","flew","have flown"],3,"明日の今ごろ「飛んでいる途中」→ 未来進行形。"],
 ["fut","By next month, I ___ here for ten years.","work","will have worked",["have worked","work","had worked"],3,"来月の時点まで 10 年間続く → 未来完了（継続）。"],
 ["fut","If I visit Kyoto again, I ___ it three times.","visit","will have visited",["visit","have visited","had visited"],3,"もう一度行った時点で 3 回になる → 未来完了（経験）。"],
 ["fut","By the time you come back, I ___ dinner.","cook","will have cooked",["cook","cooked","had cooked"],3,"あなたが戻る（未来）時点までに作り終えている → 未来完了。"],
 ["adv","I'll call you when I ___ home.","get","get",["will get","got","had got"],1,"when ~（〜するとき）は時の副詞節 → 未来のことでも現在形。"],
 ["adv","If it ___ tomorrow, we will stay home.","rain","rains",["will rain","rained","has rained"],1,"if ~（もし〜なら）は条件の副詞節 → 未来でも現在形。"],
 ["adv","Wait here until I ___ back.","come","come",["will come","came","had come"],2,"until ~（〜するまで）も時の副詞節 → 現在形。"],
 ["adv","If you ___ any questions, please ask me.","have","have",["will have","had","are having"],2,"条件の副詞節 → 現在形。"],
 ["adv","As soon as I ___ my homework, I'll go out.","finish","finish",["will finish","finished","had finished"],2,"as soon as ~ も時の副詞節 → 現在形（have finished でもよい）。",["have finished"]],
 ["adv","By the time you ___ , I will have finished dinner.","arrive","arrive",["will arrive","arrived","had arrived"],3,"by the time ~（〜するまでに）は時の副詞節 → 現在形。"],
 ["adv","I don't know if he ___ tomorrow.","come","will come",["comes","came","has come"],3,"if ~ は「〜かどうか」で know の目的語（名詞節）→ 未来なら will。"],
 ["adv","I wonder when he ___ .","arrive","will arrive",["had arrived","arrives","has arrived"],3,"when ~ は「いつ〜か」で wonder の目的語（名詞節）→ 未来なら will。"],
].map(r=>({c:r[0],s:r[1],v:r[2],a:r[3],d:r[4],l:r[5],e:r[6],alt:r[7]||[]}));

function rng(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function shuf(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const TSEC={mc:"次の英文の（　）に入る最も適切なものを、a〜d から 1 つ選びなさい。",form:"次の英文の（　）内の動詞を、適切な形に直して書きなさい（2 語以上になることもある）。",err:"次の英文の下線部には誤りがあります。正しい形に直しなさい。"};

// ---------- 演習 ----------
const HELP={pres:"s2",past:"s1",perf:"s3",plu:"s4",fut:"s4",adv:"s5"};
const DINST={mc:"（　）に入る最も適切なものを選びなさい。",form:"（　）内の動詞を適切な形に直しなさい（2 語以上になることもある）。",err:"下線部の誤りを正しい形に直しなさい。"};
const ds={mode:"prac",deck:[],q:null,done:false,tot:0,ok:0,streak:0,by:{},miss:[],idx:0,queue:[]};
const R=Math.random;
function chipRow(el,list,on){el.innerHTML=list.map(([k,n])=>`<button type="button" class="chip" data-k="${k}" aria-pressed="${on(k)}">${n}</button>`).join("");
  el.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const cur=b.getAttribute("aria-pressed")==="true";
    if(cur&&el.querySelectorAll('[aria-pressed="true"]').length===1)return;b.setAttribute("aria-pressed",String(!cur))})}
const onKeys=el=>[...el.querySelectorAll('[aria-pressed="true"]')].map(b=>b.dataset.k);
chipRow($("dcats"),CATS,()=>true);chipRow($("dtypes"),TYPES,k=>k!=="err");
function setMode(m){ds.mode=m;$("mPrac").setAttribute("aria-pressed",m==="prac");$("mTest").setAttribute("aria-pressed",m==="test")}
$("mPrac").addEventListener("click",()=>setMode("prac"));$("mTest").addEventListener("click",()=>setMode("test"));
$("dstart").addEventListener("click",()=>{dbegin();$("dstatus").scrollIntoView({block:"start",behavior:"smooth"})});
const catName=k=>CATS.find(c=>c[0]===k)[1];
const norm=s=>String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.,!?。]+$/,"").replace(/\s+/g," ").trim();
function dbegin(){
  ds.cats=onKeys($("dcats"));ds.types=onKeys($("dtypes"));const lv=+$("dlevel").value;
  ds.pool=B.filter(q=>ds.cats.includes(q.c)&&q.l<=lv);ds.deck=[];
  ds.tot=ds.ok=ds.streak=ds.idx=0;ds.by={};ds.miss=[];
  if(!ds.pool.length){$("dstatus").innerHTML="";$("dmain").innerHTML='<p class="note" style="margin-top:12px">この範囲とレベルの問題がありません。レベルを上げてください。</p>';return}
  if(ds.mode==="test"){let q=[];while(q.length<10)q=q.concat(shuf(ds.pool,R));ds.queue=q.slice(0,10)}
  dnext();
}
function dnext(){
  let q;if(ds.mode==="test")q=ds.queue[ds.idx];else{if(!ds.deck.length)ds.deck=shuf(ds.pool,R);q=ds.deck.pop()}
  const t=ds.types[Math.floor(R()*ds.types.length)];
  ds.q={q,t,ch:t==="mc"?shuf([q.a,...q.d],R):null};ds.done=false;drender();
}
function dstat(){
  if(ds.mode==="test")return `<span>テスト <b>${Math.min(ds.idx+1,10)}</b> / 10 問目</span><div class="prog"><i style="width:${ds.idx*10}%"></i></div><span>正解 <b>${ds.ok}</b></span>`;
  return `<span>正解 <b>${ds.ok}</b> / ${ds.tot}</span><span>連続正解 <b>${ds.streak}</b></span>`;
}
function sentence(it){const q=it.q,s=esc(q.s);
  if(it.t==="mc")return s.replace("___",'<span class="bl">（　　）</span>');
  if(it.t==="form")return s.replace("___",`<span class="bl">（${esc(q.v)}）</span>`);
  return s.replace("___",`<span class="ul">${esc(q.d[0])}</span>`)}
function drender(){
  $("dstatus").innerHTML=dstat();const it=ds.q;
  const inp=it.t==="mc"?`<div class="opts">${it.ch.map((c,i)=>`<button type="button" class="opt" data-i="${i}">${"abcd"[i]}) ${esc(c)}</button>`).join("")}</div>`
    :`<form class="dans" id="daf"><input id="dval" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="答え" placeholder="${it.t==="form"?"動詞の形":"正しい形"}を入力"><button class="primary" type="submit">採点する</button><button type="button" id="dgive">答えを見る</button></form>`;
  $("dmain").innerHTML=`<div class="card"><span class="tag">${catName(it.q.c)}</span><span class="tag">${["","基礎","標準","入試"][it.q.l]}</span><div class="qinst">${DINST[it.t]}</div><div class="qen">${sentence(it)}</div>${inp}<div id="dfb"></div></div>`;
  if(it.t==="mc"){$("dmain").querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{if(!ds.done)dgrade(it.ch[+b.dataset.i],b)}))}
  else{$("daf").addEventListener("submit",e=>{e.preventDefault();if(ds.done){dadv();return}const v=$("dval").value;if(!v.trim()){$("dfb").innerHTML='<p class="note" style="color:var(--ng);margin-top:8px">答えを入力してください。</p>';return}dgrade(v)});
    $("dgive").addEventListener("click",()=>{if(!ds.done)dgrade(null)});$("dval").focus({preventScroll:true})}
}
function dgrade(u,btn){
  const it=ds.q,q=it.q,gave=u===null,ok=!gave&&[q.a,...q.alt].some(a=>norm(a)===norm(u));
  ds.done=true;ds.tot++;if(ok){ds.ok++;ds.streak++}else{ds.streak=0;ds.miss.push({it,u})}
  const b=ds.by[q.c]||(ds.by[q.c]={t:0,o:0});b.t++;if(ok)b.o++;
  if(it.t==="mc"){$("dmain").querySelectorAll(".opt").forEach(o=>{const c=it.ch[+o.dataset.i];o.disabled=true;o.style.opacity=1;if(c===q.a)o.classList.add("right");else if(o===btn)o.classList.add("wrong")})}
  else{$("dval").readOnly=true;$("dgive").disabled=true;$("daf").querySelector("[type=submit]").disabled=true}
  const last=ds.mode==="test"&&ds.idx===9;
  const alt=q.alt.length?`（${q.alt.map(esc).join(" / ")} も可）`:"";
  $("dfb").innerHTML=`<div class="fb ${ok?"ok":"ng"}"><div class="verdict">${ok?"◯ 正解！":gave?"解き方を確認しよう":"✕ おしい！"}</div>
    <div class="ansl">答え：<b>${it.t==="err"?esc(q.d[0])+" → ":""}${esc(q.a)}</b>${alt}${!ok&&!gave&&it.t!=="mc"?`　（あなたの答え：${esc(u)}）`:""}</div>
    <div class="expl">${esc(q.e)}<a href="jisei-lab.html#${HELP[q.c]}" target="_blank" rel="noopener">解説を読む ↗</a></div>
    <div class="nextrow"><button class="primary" type="button" id="dnx">${last?"結果を見る":"次の問題"}</button></div></div>`;
  $("dnx").addEventListener("click",dadv);$("dnx").focus({preventScroll:true});$("dstatus").innerHTML=dstat();
}
function dadv(){if(ds.mode==="test"){ds.idx++;if(ds.idx>=10){dresult();return}}dnext()}
function dresult(){
  $("dstatus").innerHTML="";
  const rows=ds.cats.filter(c=>ds.by[c]).map(c=>{const b=ds.by[c];return `<div class="cbar"><span>${catName(c)}</span><span class="t"><i style="width:${b.o/b.t*100}%"></i></span><span class="v">${b.o}/${b.t}</span></div>`}).join("");
  const miss=ds.miss.map(({it,u})=>`<div class="m"><span class="tag">${catName(it.q.c)}</span><div class="en2" style="margin-top:4px">${sentence(it)}</div><div class="a">正解 <b>${esc(it.q.a)}</b>${u===null?"　（答えを見た）":"　あなた "+esc(u)}</div><div class="note">${esc(it.q.e)}</div></div>`).join("");
  const msg=ds.ok===10?"満点！この調子で。":ds.ok>=8?"よくできました。間違えた問題だけ見直そう。":ds.ok>=5?"あと少し。苦手な範囲を練習モードで。":"まずは時制ラボで考え方を確認してから練習しよう。";
  $("dmain").innerHTML=`<div class="card"><b class="note">テスト結果</b><div class="score">${ds.ok}<small> / 10 問正解</small></div><p style="margin:6px 0 0">${msg}</p><div class="cbars">${rows}</div>
    ${miss?`<h3 style="margin:20px 0 0;font-size:1.05rem">間違えた問題の見直し</h3><div class="miss">${miss}</div>`:""}
    <div class="nextrow" style="margin-top:18px"><button class="primary" type="button" id="dagain">もう一度テスト</button><button type="button" id="dprac">練習モードへ</button></div></div>`;
  $("dagain").addEventListener("click",dbegin);$("dprac").addEventListener("click",()=>{setMode("prac");dbegin()});
}
dbegin();

$("cats").innerHTML=CATS.map(([k,n])=>`<label><input type="checkbox" id="c_${k}" checked> ${n}</label>`).join("");
$("types").innerHTML=TYPES.map(([k,n],i)=>`<label><input type="checkbox" id="t_${k}" ${i<2?"checked":""}> ${n}</label>`).join("");

function build(){
  const seed=Math.max(1,parseInt($("seed").value,10)||1),r=rng(seed*7919);
  const cats=CATS.map(c=>c[0]).filter(k=>$("c_"+k).checked),types=TYPES.map(t=>t[0]).filter(k=>$("t_"+k).checked);
  const lv=+$("level").value,n=+$("count").value;
  let pool=B.filter(q=>cats.includes(q.c)&&q.l<=lv);
  const sheets=$("sheets");
  if(!cats.length||!types.length||!pool.length){sheets.innerHTML='<p class="note" style="padding:20px">出題範囲と問題の形式を 1 つ以上選んでください。</p>';$("summary").textContent="";return}
  // pick n (repeat pool with reshuffle if short)
  let picked=[];while(picked.length<n){picked=picked.concat(shuf(pool,r))}picked=picked.slice(0,n);
  // assign types evenly, then group by type in TYPES order
  const tq=types.map(()=>[]);picked.forEach((q,i)=>tq[i%types.length].push(q));
  const items=[];types.forEach((t,ti)=>tq[ti].forEach(q=>{const it={t,q};if(t==="mc")it.ch=shuf([q.a,...q.d],r);items.push(it)}));
  items.forEach((it,i)=>it.no=i+1);
  const catNames=cats.map(k=>CATS.find(c=>c[0]===k)[1]).join("・");
  const lvName=["","基礎","基礎＋標準","基礎〜入試"][lv];
  // layout: units per page
  const H={mc:64,form:42,err:60},SEC=44,CAP=1040,CAP1=920;
  const pages=[];let cur=[],used=0,cap=CAP1,lastT=null;
  items.forEach(it=>{const h=H[it.t]+(it.t!==lastT?SEC:0);if(used+h>cap&&cur.length){pages.push(cur);cur=[];used=0;cap=CAP;lastT=null}
    const hh=H[it.t]+(it.t!==lastT?SEC:0);cur.push(it);used+=hh;lastT=it.t});
  if(cur.length)pages.push(cur);
  const withAns=$("withAns").checked;
  const ansPages=[];if(withAns){let c2=[],u=0;items.forEach(it=>{const cp=ansPages.length?CAP:CAP1-30;if(u+56>cp&&c2.length){ansPages.push(c2);c2=[];u=0}c2.push(it);u+=56});if(c2.length)ansPages.push(c2)}
  const total=pages.length+ansPages.length;
  const head=(title,sub)=>`<div class="sh-head"><div><div class="sh-title">${title}</div><div class="sh-meta">${esc(sub)}</div></div><div class="sh-name"><div>　月　　日</div></div><div class="sh-name" style="grid-column:1/-1"><div>組 <span class="sm"></span></div><div>番 <span class="sm"></span></div><div>名前 <span></span></div><div style="margin-left:auto">得点 <span class="sm"></span>/ ${n}</div></div></div>`;
  const foot=(i)=>`<div class="sh-foot"><span>時制プリント No.${seed}</span><span>${i} / ${total}</span></div>`;
  const qHTML=it=>{const q=it.q;
    if(it.t==="mc")return `<div class="q"><span class="qn">(${it.no})</span><div><div class="en">${esc(q.s).replace("___",'<span class="blank">　　　</span>')}</div><div class="choices">${it.ch.map((c,i)=>`<span>${"abcd"[i]}) ${esc(c)}</span>`).join("")}</div></div></div>`;
    if(it.t==="form")return `<div class="q"><span class="qn">(${it.no})</span><div class="en">${esc(q.s).replace("___",`<span class="blank">（${esc(q.v)}）</span>`)}</div></div>`;
    return `<div class="q"><span class="qn">(${it.no})</span><div><div class="en">${esc(q.s).replace("___",`<span class="ul">${esc(q.d[0])}</span>`)}</div><div class="fix">正しい形：<span></span></div></div></div>`;};
  let html="",pi=0;
  pages.forEach((pg,i)=>{pi++;let body="",lt=null;pg.forEach(it=>{if(it.t!==lt){body+=`<div class="sec">${TSEC[it.t]}</div>`;lt=it.t}body+=qHTML(it)});
    html+=`<div class="frame"><div class="sheet">${i===0?head("時制 練習プリント",`範囲：${catNames}　／　レベル：${lvName}`):""}${body}${foot(pi)}</div></div>`});
  ansPages.forEach((pg,i)=>{pi++;const body=pg.map(it=>{const q=it.q,ans=it.t==="mc"?`${"abcd"[it.ch.indexOf(q.a)]}) ${q.a}`:it.t==="err"?`${q.d[0]} → ${q.a}`:q.a;
      return `<div class="q"><span class="qn">(${it.no})</span><div><span class="a">${esc(ans)}</span><span class="lvl">${["","基礎","標準","入試"][q.l]}</span><div class="e">${esc(q.e)}</div></div></div>`}).join("");
    html+=`<div class="frame"><div class="sheet ans">${i===0?`<div class="sh-head"><div><div class="sh-title">解答・解説</div><div class="sh-meta">時制 練習プリント No.${seed}　／　範囲：${esc(catNames)}</div></div></div>`:""}${body}${foot(pi)}</div></div>`});
  sheets.innerHTML=html;
  $("summary").textContent=`No.${seed}　${n} 問　問題 ${pages.length} 枚${withAns?`＋解答 ${ansPages.length} 枚`:""}`;
  zoom();
}
function zoom(){const w=$("zoomer").clientWidth||794;const z=Math.min(1,(w-4)/794);$("zoomer").style.setProperty("--z",z.toFixed(4))}
new ResizeObserver(zoom).observe($("zoomer"));
function store(k,v){try{localStorage.setItem("tprint_"+k,v)}catch(e){}}
function load(k){try{return localStorage.getItem("tprint_"+k)}catch(e){return null}}
function saveAll(){store("cats",CATS.map(c=>c[0]).filter(k=>$("c_"+k).checked).join(","));store("types",TYPES.map(t=>t[0]).filter(k=>$("t_"+k).checked).join(","));store("level",$("level").value);store("count",$("count").value);store("withAns",$("withAns").checked)}
["cats","types"].forEach(id=>$(id).addEventListener("change",()=>{saveAll();build()}));
["level","count","withAns","seed"].forEach(id=>$(id).addEventListener("change",()=>{saveAll();build()}));
$("newp").addEventListener("click",()=>{$("seed").value=Math.floor(Math.random()*9000)+1;build()});
// restore
(()=>{const c=load("cats");if(c){const on=c.split(",");CATS.forEach(([k])=>$("c_"+k).checked=on.includes(k))}
  const t=load("types");if(t){const on=t.split(",");TYPES.forEach(([k])=>$("t_"+k).checked=on.includes(k))}
  const l=load("level");if(l)$("level").value=l;const n=load("count");if(n)$("count").value=n;const a=load("withAns");if(a!==null)$("withAns").checked=a==="true"})();
// print (works only when opened directly, e.g. on the public site)
let top=true;try{top=window.self===window.top}catch(e){top=false}
if(top){$("print").addEventListener("click",()=>window.print())}else{$("print").hidden=true;$("printNote").textContent="印刷は公開サイトで開いたときに使えます。PDF はここから保存できます。"}
let dl=null;try{if(window.claude&&window.claude.use)window.claude.use("downloads").then(d=>{dl=d}).catch(()=>{})}catch(e){}
$("pdf").addEventListener("click",async()=>{
  const b=$("pdf"),note=$("printNote"),old=b.textContent;
  if(!window.html2canvas||!window.jspdf){note.textContent="PDF の準備に失敗しました。ページを再読み込みしてください。";return}
  if(!top&&!dl){note.textContent="この画面ではダウンロードできません。公開サイトで開いてください。";return}
  b.disabled=true;const z=$("zoomer"),zv=z.style.getPropertyValue("--z");z.style.setProperty("--z","1");
  try{
    try{await document.fonts.ready}catch(e){}
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"mm",format:"a4",compress:true});
    const sh=[...document.querySelectorAll(".sheet")];
    for(let i=0;i<sh.length;i++){b.textContent=`作成中… ${i+1}/${sh.length}`;
      const cv=await html2canvas(sh[i],{scale:2.5,backgroundColor:"#ffffff",logging:false});
      if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297)}
    const blob=pdf.output("blob"),name=`時制プリント_No${$("seed").value}${$("withAns").checked?"_解答つき":""}.pdf`;
    if(dl){try{await dl.save({filename:name,data:blob});note.textContent="PDF を保存しました。"}catch(e){note.textContent=e&&e.code==="declined"?"ダウンロードをキャンセルしました。":"ダウンロードできませんでした。"}}
    else{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);note.textContent="PDF をダウンロードしました。"}
  }catch(e){note.textContent="PDF を作れませんでした。もう一度お試しください。"}
  finally{z.style.setProperty("--z",zv||"1");zoom();b.disabled=false;b.textContent=old}
});
build();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(build);
})();
</script>
