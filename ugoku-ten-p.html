<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>動く点Pと三角形の面積</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f6fa; --paper:#ffffff; --grid:#dfe7f1; --grid2:#c9d6e6;
  --ink:#16243a; --muted:#5a6b82; --line:#c7d3e2;
  --ab:#2a64c5; --bc:#d97a1e; --cd:#23946a;
  --tri:#e0457b; --tri-fill:rgba(224,69,123,.22);
  --focus:#2a64c5; --chip:#e8eef7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1622; --paper:#162131; --grid:#1f2d41; --grid2:#2a3b53;
    --ink:#e6edf7; --muted:#95a6bd; --line:#2f415a;
    --ab:#6c9bf0; --bc:#f0a257; --cd:#4fc796;
    --tri:#f47aa3; --tri-fill:rgba(244,122,163,.26);
    --focus:#6c9bf0; --chip:#1f2d41;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1622; --paper:#162131; --grid:#1f2d41; --grid2:#2a3b53;
  --ink:#e6edf7; --muted:#95a6bd; --line:#2f415a;
  --ab:#6c9bf0; --bc:#f0a257; --cd:#4fc796;
  --tri:#f47aa3; --tri-fill:rgba(244,122,163,.26);
  --focus:#6c9bf0; --chip:#1f2d41;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.6;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header h1{font-family:"Zen Maru Gothic",sans-serif;font-size:1.55rem;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:"Zen Maru Gothic",sans-serif;font-size:1rem;margin:0;letter-spacing:.04em;color:var(--muted)}
svg{display:block;width:100%;height:auto;touch-action:none}
.var{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:1.08em}
.num{font-variant-numeric:tabular-nums}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
@media (max-width:460px){.controls{grid-template-columns:1fr}}
.ctl label{display:flex;justify-content:space-between;font-weight:500;font-size:.93rem}
.ctl label b{font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--focus)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.playbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.playbar button{font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500}
.playbar button.primary{background:var(--tri);border-color:var(--tri);color:#fff}
.playbar input{flex:1 1 180px}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.readout{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline}
.readout .big{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.readout .where{padding:2px 10px;border-radius:999px;color:#fff;font-size:.88rem;font-weight:700}
.explain{background:var(--chip);border-radius:8px;padding:10px 12px;font-size:.95rem}
.formulas{display:flex;flex-direction:column;gap:6px}
.frow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;border:1px solid transparent}
.frow.on{border-color:currentColor;background:var(--chip)}
.frow .tag{font-weight:700;font-size:.85rem;padding:1px 8px;border-radius:999px;color:#fff}
.frow .eq{color:var(--ink);font-size:1.05rem}
.frow .dom{color:var(--muted);font-size:.88rem;white-space:nowrap}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.05;margin:0 1px;font-style:normal;font-family:"Zen Kaku Gothic New",sans-serif}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 2px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;font-size:.9rem;color:var(--muted)}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.note{color:var(--muted);font-size:.85rem;margin:0}
select{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:3px 6px}
.names{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.9rem}
.names label{display:flex;gap:6px;align-items:center}
.group{display:flex;flex-direction:column;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.group:first-of-type{border-top:0;padding-top:0}
.group h3{margin:0;font-size:.85rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
.route{font-weight:700;font-size:1rem}
svg text{font-family:"Zen Kaku Gothic New",sans-serif}
</style>

<div class="wrap">
  <header>
    <h1>動く点Pと三角形の面積</h1>
    <p id="lead"></p>
    <div class="seg" id="shape" style="margin-top:10px">
      <button data-s="rect" aria-pressed="true">長方形</button>
      <button data-s="tri" aria-pressed="false">直角三角形</button>
    </div>
  </header>

  <div class="grid">
    <section class="panel" aria-label="図形">
      <h2>図形</h2>
      <svg id="fig" viewBox="0 0 560 440" role="img" aria-label="図形と点P"></svg>
      <div class="playbar">
        <button id="reset" title="出発点に戻す">⏮ 最初</button>
        <button id="back">−1秒</button>
        <button id="play" class="primary">▶ 再生</button>
        <button id="fwd">＋1秒</button>
        <input id="x" type="range" min="0" max="20" step="0.05" value="3" aria-label="時間x">
      </div>
      <div class="readout">
        <span><span class="var">x</span> = <span class="big" id="xv">3</span> 秒</span>
        <span><span class="var">y</span> = <span class="big" id="yv">9</span> cm²</span>
        <span class="where" id="where"></span>
      </div>
      <div class="explain" id="explain"></div>
    </section>

    <div style="display:flex;flex-direction:column;gap:16px">
      <section class="panel" aria-label="設定">
        <h2>設定</h2>
        <div class="group">
          <h3>図形の形と名前</h3>
          <div class="ctl" id="orientBox">
            <label>直角の位置</label>
            <div class="seg" id="orient">
              <button data-r="TL">左上</button><button data-r="TR">右上</button>
              <button data-r="BL">左下</button><button data-r="BR">右下</button>
            </div>
          </div>
          <div class="ctl">
            <label>頂点の名前（重なったら自動で入れかわります）</label>
            <div class="names" id="names"></div>
          </div>
          <div class="controls">
            <div class="ctl">
              <label for="h"><span id="hName">縦</span> <b><span id="hv">4</span> cm</b></label>
              <input id="h" type="range" min="1" max="12" step="1" value="4">
            </div>
            <div class="ctl">
              <label for="w"><span id="wName">横</span> <b><span id="wv">6</span> cm</b></label>
              <input id="w" type="range" min="1" max="14" step="1" value="6">
            </div>
          </div>
        </div>
        <div class="group">
          <h3>点Pの動き</h3>
          <div class="names">
            <label>出発点 <select id="start"></select></label>
            <label>通る辺の数 <select id="edges"></select></label>
          </div>
          <div class="seg" id="dir"></div>
          <div class="ctl">
            <label>速さ</label>
            <div class="seg" id="speed">
              <button data-v="1" aria-pressed="true">毎秒 1 cm</button>
              <button data-v="2" aria-pressed="false">毎秒 2 cm</button>
            </div>
          </div>
        </div>
        <div class="group">
          <h3>面積を調べる三角形</h3>
          <div class="seg" id="tri"></div>
        </div>
        <div class="toggles">
          <label><input type="checkbox" id="showF" checked> 式を表示</label>
          <label><input type="checkbox" id="showG" checked> グラフを表示</label>
          <label><input type="checkbox" id="showH" checked> 底辺・高さを表示</label>
        </div>
      </section>

      <section class="panel" id="fPanel" aria-label="式">
        <h2><span class="var">y</span> を <span class="var">x</span> の式で表す</h2>
        <div class="formulas" id="formulas"></div>
      </section>

      <section class="panel" id="gPanel" aria-label="グラフ">
        <h2>グラフ</h2>
        <svg id="graph" viewBox="0 0 540 320" role="img" aria-label="xとyのグラフ"></svg>
        <p class="note">線の色は、点Pがいる辺の色と対応しています。</p>
      </section>
    </div>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const EPS = 1e-7;
const st = {
  shape:"rect", h:4, w:6, v:1, x:3, playing:false,
  rectL:{TL:"A",BL:"B",BR:"C",TR:"D"},
  triL:{V:"A",R:"B",H:"C"}, triR:"BL",
  start:"A", dir:1, edges:3, pair:["A","D"]
};
const DEF = {
  rect:{start:"A",dir:1,edges:3,pair:["A","D"]},
  tri:{start:"A",dir:1,edges:2,pair:["A","C"]}
};
const POSNAME = {TL:"左上",BL:"左下",BR:"右下",TR:"右上"};

// ---------- numbers ----------
const r2 = n => Math.round(n*100)/100;
const fmt = n => { n=r2(n); return (Object.is(n,-0)?0:n).toString(); };
function nice(n){ for(const k of [1,2,3,4,5,6,8,10,12]){ if(Math.abs(n*k-Math.round(n*k))<1e-6) return Math.round(n*k)/k; } return n; }
function fracHTML(n){
  n=nice(n); const s=n<0?"−":""; const a=Math.abs(n);
  for(const k of [1,2,3,4,5,6,8,10,12]){
    const m=a*k; if(Math.abs(m-Math.round(m))<1e-6){
      if(k===1) return s+Math.round(a);
      return `${s}<span class="frac"><span>${Math.round(m)}</span><span>${k}</span></span>`;
    }
  }
  return s+fmt(a);
}
const X_='<span class="var">x</span>', Y_='<span class="var">y</span>';
const HALF='<span class="frac"><span>1</span><span>2</span></span>';
function coefX(a){ a=Math.abs(nice(a)); return (Math.abs(a-1)<EPS?"":fracHTML(a))+X_; }
function linHTML(a,b){
  a=nice(a); b=nice(b); let out;
  if (Math.abs(a)>EPS){
    out=(a<0?"−":"")+coefX(a);
    if (Math.abs(b)>EPS) out += (b>0?" ＋ ":" − ")+fracHTML(Math.abs(b));
  } else out=fracHTML(b);
  return Y_+" ＝ "+out;
}
// length expression (always positive in its range)
function lenExpr(a,b){
  a=nice(a); b=nice(b);
  if (Math.abs(a)<EPS) return {html:fracHTML(b),comp:false};
  if (Math.abs(b)<EPS) return {html:coefX(a),comp:false};
  if (a>0) return {html:`${coefX(a)} − ${fracHTML(-b)}`,comp:true};
  return {html:`${fracHTML(b)} − ${coefX(a)}`,comp:true};
}
const paren = e => e.comp?`(${e.html})`:e.html;

// ---------- geometry ----------
function corner(k){ const {h,w}=st; return {TL:[0,0],BL:[0,h],BR:[w,h],TR:[w,0]}[k]; }
function geom(){
  if (st.shape==="rect"){
    const L=st.rectL, order=["TL","BL","BR","TR"];
    const pts={}, pos={}; order.forEach(c=>{pts[L[c]]=corner(c); pos[L[c]]=c;});
    return {pts,pos,cycle:order.map(c=>L[c]),right:null};
  }
  const R=st.triR, Rc=corner(R);
  const V=Object.keys(POSNAME).find(c=>c!==R && corner(c)[0]===Rc[0]);
  const H=Object.keys(POSNAME).find(c=>c!==R && corner(c)[1]===Rc[1]);
  const L=st.triL, pts={}, pos={};
  pts[L.V]=corner(V); pos[L.V]=V; pts[L.R]=Rc; pos[L.R]=R; pts[L.H]=corner(H); pos[L.H]=H;
  return {pts,pos,cycle:[L.V,L.R,L.H],right:L.R};
}
function routeLetters(){
  const c=geom().cycle, n=c.length, i0=c.indexOf(st.start), out=[];
  for(let j=0;j<=st.edges;j++) out.push(c[((i0+st.dir*j)%n+n)%n]);
  return out;
}
function segs(){
  const G=geom(), R=routeLetters(), out=[];
  for(let i=0;i<R.length-1;i++){ const p=G.pts[R[i]], q=G.pts[R[i+1]]; out.push({a:R[i],b:R[i+1],p,q,len:Math.hypot(q[0]-p[0],q[1]-p[1]),name:[R[i],R[i+1]].sort().join("")}); }
  return out;
}
function times(){ const T=[0]; segs().forEach(s=>T.push(T.at(-1)+s.len/st.v)); return T; }
function section(x){ const T=times(); for(let k=1;k<T.length-1;k++) if(x<T[k]-1e-9) return k-1; return T.length-2; }
function posP(x){
  const S=segs(); let s=Math.max(0,x*st.v);
  for(let i=0;i<S.length;i++){ const g=S[i];
    if(s<=g.len+1e-9||i===S.length-1){ const t=Math.min(s/g.len,1); return [g.p[0]+(g.q[0]-g.p[0])*t,g.p[1]+(g.q[1]-g.p[1])*t]; }
    s-=g.len; }
}
const triArea=(P,A,B)=>Math.abs((A[0]-P[0])*(B[1]-P[1])-(A[1]-P[1])*(B[0]-P[0]))/2;
function area(x){ const G=geom(); return triArea(posP(x),G.pts[st.pair[0]],G.pts[st.pair[1]]); }
function pieces(){
  const T=times();
  return segs().map((_,i)=>{ const y0=area(T[i]), y1=area(T[i+1]); const a=(y1-y0)/(T[i+1]-T[i]); return [nice(a), nice(y0-a*T[i])]; });
}
const aligned=(p,q)=>Math.abs(p[0]-q[0])<EPS||Math.abs(p[1]-q[1])<EPS;
function proj(pt,p,q){ const dx=q[0]-p[0],dy=q[1]-p[1]; const t=((pt[0]-p[0])*dx+(pt[1]-p[1])*dy)/(dx*dx+dy*dy); return [p[0]+dx*t,p[1]+dy*t]; }
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);

// base / height analysis for current section
function analysis(x){
  const G=geom(), k=section(x), S=segs()[k], T=times(), [Xn,Yn]=st.pair;
  const pc=pieces()[k];
  if (Math.abs(pc[0])<EPS && Math.abs(pc[1])<EPS) return {zero:true, seg:S};
  const letterAt=pt=>Object.keys(G.pts).find(l=>dist(G.pts[l],pt)<1e-6);
  const Z = [Xn,Yn].find(l=>l===S.a||l===S.b);
  const W = Z===Xn?Yn:Xn;
  const segAligned = aligned(S.p,S.q), XYal = aligned(G.pts[Xn],G.pts[Yn]);
  let mode = (Z && segAligned) ? 1 : XYal ? 2 : Z ? 1 : 2;
  const lin = f => { const a0=f(T[k]), a1=f(T[k+1]); const a=(a1-a0)/(T[k+1]-T[k]); return [a, a0-a*T[k]]; };
  let base, height, bName, hName, bLin, hLin;
  const P=posP(x);
  if (mode===1){
    base=[G.pts[Z],P]; bName=Z+"P"; bLin=lin(t=>dist(G.pts[Z],posP(t)));
    const F=proj(G.pts[W],S.p,S.q); height=[G.pts[W],F];
    const fl=letterAt(F); hName = fl ? [W,fl].sort().join("") : "";
    hLin=[0,dist(G.pts[W],F)];
  } else {
    base=[G.pts[Xn],G.pts[Yn]]; bName=[Xn,Yn].sort().join(""); bLin=[0,dist(G.pts[Xn],G.pts[Yn])];
    const F=proj(P,G.pts[Xn],G.pts[Yn]); height=[P,F];
    const fl=letterAt(F);
    hName = fl ? fl+"P" : "";
    hLin=lin(t=>{const Q=posP(t); return dist(Q,proj(Q,G.pts[Xn],G.pts[Yn]));});
  }
  // same-length edge hint for unnamed constant height
  let hint="";
  if (!hName && Math.abs(hLin[0])<EPS){
    const c=G.cycle; const hv=[height[1][0]-height[0][0],height[1][1]-height[0][1]];
    for(let i=0;i<c.length;i++){ const a=G.pts[c[i]], b=G.pts[c[(i+1)%c.length]];
      const ev=[b[0]-a[0],b[1]-a[1]];
      if (Math.abs(hv[0]*ev[1]-hv[1]*ev[0])<1e-6 && Math.abs(Math.hypot(...ev)-hLin[1])<1e-6){ hint=`（辺${[c[i],c[(i+1)%c.length]].sort().join("")}と同じ長さ）`; break; } }
  }
  return {zero:false, seg:S, base, height, bName, hName, bLin, hLin, hint};
}
function explainHTML(x){
  const A=analysis(x);
  if (A.zero) return `点Pが辺${A.seg.name}上にある間は、三角形ができない<br>${Y_} ＝ 0`;
  const be=lenExpr(...A.bLin), he=lenExpr(...A.hLin);
  const bc=Math.abs(A.bLin[0])<EPS, hc=Math.abs(A.hLin[0])<EPS;
  const hn = A.hName ? "高さ "+A.hName : "高さ";
  let s=`底辺 ${A.bName} ＝ ${be.html} cm、${hn} ＝ ${he.html} cm${A.hint}`;
  if (bc&&hc) s+="（どちらも一定）";
  s+=`<br>${Y_} ＝ ${HALF} × ${paren(be)} × ${paren(he)}`;
  if (bc&&hc) s+=` ＝ ${fracHTML(A.bLin[1]*A.hLin[1]/2)}`;
  return s;
}

const SEGCOL=["--ab","--bc","--cd","--tri"];
const segCol = i => i<3 ? SEGCOL[i] : "--muted";
const col = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
function el(tag, attrs={}, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function txt(parent,x,y,s,attrs={}){ const t=el("text",{x,y,...attrs},parent); t.textContent=s; return t; }

// ---------- figure ----------
const fig=$("fig"); const FW=560, FH=440, PAD=62;
let geo={s:1,ox:0,oy:0};
function drawFig(){
  const {h,w}=st; fig.innerHTML="";
  const s=Math.min((FW-2*PAD)/w,(FH-2*PAD)/h);
  const ox=(FW-w*s)/2, oy=(FH-h*s)/2; geo={s,ox,oy};
  const S=p=>[ox+p[0]*s, oy+p[1]*s];
  const ink=col("--ink"), paper=col("--paper"), tc=col("--tri");
  const G=geom(), c=G.cycle;
  const cen=c.reduce((m,l)=>[m[0]+G.pts[l][0]/c.length,m[1]+G.pts[l][1]/c.length],[0,0]);

  const cp=el("clipPath",{id:"clipShape"},el("defs",{},fig));
  el("polygon",{points:c.map(l=>S(G.pts[l]).join(",")).join(" ")},cp);
  const g=el("g",{"clip-path":"url(#clipShape)"},fig);
  for(let i=0;i<=w;i++){ const a=S([i,0]),b=S([i,h]); el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:col("--grid"),"stroke-width":1},g); }
  for(let j=0;j<=h;j++){ const a=S([0,j]),b=S([w,j]); el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:col("--grid"),"stroke-width":1},g); }

  const Pc=posP(st.x), P=S(Pc), k=section(st.x), a=area(st.x);
  const tv=[Pc,G.pts[st.pair[0]],G.pts[st.pair[1]]].map(S);
  if (a>1e-6) el("polygon",{points:tv.map(p=>p.join(",")).join(" "),fill:col("--tri-fill"),stroke:tc,"stroke-width":2.5,"stroke-linejoin":"round"},fig);

  // outline, then route edges colored
  for(let i=0;i<c.length;i++){ const p=S(G.pts[c[i]]), q=S(G.pts[c[(i+1)%c.length]]); el("line",{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:ink,"stroke-width":2.5},fig); }
  segs().forEach((sg,i)=>{ const p=S(sg.p),q=S(sg.q); el("line",{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:col(segCol(i)),"stroke-width":i<3?4:3,"stroke-linecap":"round","stroke-dasharray":i<3?"none":"8 5"},fig); });
  // right-angle mark
  if (G.right){ const R=G.pts[G.right], sx=Math.sign(cen[0]-R[0]), sy=Math.sign(cen[1]-R[1]), Rp=S(R), m=14;
    el("path",{d:`M${Rp[0]} ${Rp[1]+sy*m} H${Rp[0]+sx*m} V${Rp[1]}`,fill:"none",stroke:ink,"stroke-width":1.5},fig); }

  // base & height
  if ($("showH").checked && a>1e-6){
    const A=analysis(st.x);
    const tcen=[(tv[0][0]+tv[1][0]+tv[2][0])/3,(tv[0][1]+tv[1][1]+tv[2][1])/3];
    const [b0,b1]=A.base.map(S), [h0,h1]=A.height.map(S);
    el("line",{x1:b0[0],y1:b0[1],x2:b1[0],y2:b1[1],stroke:tc,"stroke-width":7,"stroke-opacity":.55,"stroke-linecap":"round"},fig);
    const hpx=dist(h0,h1);
    if (hpx>1) el("line",{x1:h0[0],y1:h0[1],x2:h1[0],y2:h1[1],stroke:tc,"stroke-width":2,"stroke-dasharray":"6 5"},fig);
    const place=(p,q,label,d)=>{
      const m=[(p[0]+q[0])/2,(p[1]+q[1])/2];
      let nx=-(q[1]-p[1]), ny=q[0]-p[0]; const L=Math.hypot(nx,ny)||1; nx/=L; ny/=L;
      if ((m[0]-tcen[0])*nx+(m[1]-tcen[1])*ny>0){ nx=-nx; ny=-ny; }
      txt(fig,m[0]+nx*d,m[1]+ny*d,label,{"text-anchor":Math.abs(nx)>0.5?(nx>0?"start":"end"):"middle","dominant-baseline":"middle",fill:tc,"font-size":14,"font-weight":700,"paint-order":"stroke",stroke:paper,"stroke-width":4});
    };
    place(b0,b1,`底辺 ${fmt(dist(...A.base))}cm`,16);
    if (hpx>1) place(h0,h1,`高さ ${fmt(dist(...A.height))}cm`,10);
  }

  // vertex labels (pushed away from center)
  for(const l of c){ const p=G.pts[l], sp=S(p);
    const dx=Math.sign(p[0]-cen[0])||0, dy=Math.sign(p[1]-cen[1])||0;
    txt(fig,sp[0]+dx*18,sp[1]+dy*17,l,{"text-anchor":"middle","dominant-baseline":"middle",fill:ink,"font-size":20,"font-weight":700}); }
  // side lengths on the vertical and horizontal sides
  const sides=[];
  for(let i=0;i<c.length;i++){ const p=G.pts[c[i]], q=G.pts[c[(i+1)%c.length]];
    if (Math.abs(p[0]-q[0])<EPS && !sides.some(s=>s.v)) sides.push({v:true,p,q});
    else if (Math.abs(p[1]-q[1])<EPS && !sides.some(s=>s.v===false)) sides.push({v:false,p,q}); }
  for(const sd of sides){
    const m=[(sd.p[0]+sd.q[0])/2,(sd.p[1]+sd.q[1])/2], sm=S(m);
    if (sd.v){ const dx=m[0]<cen[0]?-1:1, X=sm[0]+dx*38;
      txt(fig,X,sm[1],`${h}cm`,{"text-anchor":"middle","dominant-baseline":"middle",fill:muted(),"font-size":14,"font-weight":700,transform:`rotate(-90 ${X} ${sm[1]})`}); }
    else { const dy=m[1]<cen[1]?-1:1;
      txt(fig,sm[0],sm[1]+dy*34,`${w}cm`,{"text-anchor":"middle","dominant-baseline":"middle",fill:muted(),"font-size":14,"font-weight":700}); }
  }

  // P
  const pcol=col(segCol(k));
  el("circle",{cx:P[0],cy:P[1],r:16,fill:pcol,"fill-opacity":.18},fig);
  el("circle",{cx:P[0],cy:P[1],r:8,fill:paper,stroke:pcol,"stroke-width":3.5,style:"cursor:grab"},fig);
  // label P just inside the shape
  let ix=cen[0]-Pc[0], iy=cen[1]-Pc[1]; const il=Math.hypot(ix,iy)||1;
  txt(fig,P[0]+ix/il*24,P[1]+iy/il*24,"P",{"text-anchor":"middle","dominant-baseline":"middle",fill:pcol,"font-size":20,"font-weight":700,"paint-order":"stroke",stroke:paper,"stroke-width":4});
}
const muted=()=>col("--muted");

function nearestX(cx,cy){
  const r=fig.getBoundingClientRect(), k=FW/r.width;
  const m=[((cx-r.left)*k-geo.ox)/geo.s, ((cy-r.top)*k-geo.oy)/geo.s];
  let best=null, acc=0;
  for(const g of segs()){
    const dx=g.q[0]-g.p[0], dy=g.q[1]-g.p[1];
    let t=((m[0]-g.p[0])*dx+(m[1]-g.p[1])*dy)/(dx*dx+dy*dy); t=Math.min(Math.max(t,0),1);
    const d=Math.hypot(g.p[0]+dx*t-m[0],g.p[1]+dy*t-m[1]);
    if(!best||d<best.d-1e-9) best={d,s:acc+t*g.len};
    acc+=g.len;
  }
  return best.s/st.v;
}
let dragging=false;
fig.addEventListener("pointerdown",e=>{dragging=true;fig.setPointerCapture(e.pointerId);stop();setX(nearestX(e.clientX,e.clientY));});
fig.addEventListener("pointermove",e=>{if(dragging) setX(nearestX(e.clientX,e.clientY));});
fig.addEventListener("pointerup",()=>dragging=false);
fig.addEventListener("pointercancel",()=>dragging=false);

// ---------- graph ----------
const gr=$("graph"); const GW=540, GH=320, ML=52, MR=24, MT=30, MB=40;
function niceStep(range,maxTicks){ const raw=range/maxTicks; const p=Math.pow(10,Math.floor(Math.log10(raw))); for(const m of [1,2,5,10]) if(m*p>=raw) return m*p; return 10*p; }
function drawGraph(){
  gr.innerHTML="";
  const T=times(), Tmax=T.at(-1), pc=pieces();
  const ymaxv=Math.max(...T.map(t=>area(t)), st.h*st.w/2*0.25, 1);
  const xs=niceStep(Tmax,12), ys=niceStep(ymaxv,6);
  const xMax=Math.ceil(Tmax/xs-1e-9)*xs, yMax=Math.ceil(ymaxv*1.08/ys)*ys;
  const X=x=>ML+x/xMax*(GW-ML-MR), Y=y=>GH-MB-y/yMax*(GH-MT-MB);
  const ink=col("--ink"), mu=col("--muted");
  for(let x=0;x<=xMax+1e-9;x+=xs){ el("line",{x1:X(x),y1:Y(0),x2:X(x),y2:Y(yMax),stroke:col("--grid"),"stroke-width":1},gr); if(x>0) txt(gr,X(x),GH-MB+18,fmt(x),{"text-anchor":"middle",fill:mu,"font-size":12}); }
  for(let y=0;y<=yMax+1e-9;y+=ys){ el("line",{x1:X(0),y1:Y(y),x2:X(xMax),y2:Y(y),stroke:col("--grid"),"stroke-width":1},gr); if(y>0) txt(gr,X(0)-8,Y(y),fmt(y),{"text-anchor":"end","dominant-baseline":"middle",fill:mu,"font-size":12}); }
  T.slice(1).forEach(t=>el("line",{x1:X(t),y1:Y(0),x2:X(t),y2:Y(yMax),stroke:col("--grid2"),"stroke-width":1.5,"stroke-dasharray":"4 4"},gr));
  el("line",{x1:X(0),y1:Y(0),x2:X(xMax)+8,y2:Y(0),stroke:ink,"stroke-width":1.6},gr);
  el("line",{x1:X(0),y1:Y(0),x2:X(0),y2:Y(yMax)-8,stroke:ink,"stroke-width":1.6},gr);
  txt(gr,GW-4,Y(0)+34,"x（秒）",{"text-anchor":"end",fill:ink,"font-size":13,"font-style":"italic"});
  txt(gr,X(0),Y(yMax)-16,"y（cm²）",{"text-anchor":"middle",fill:ink,"font-size":13,"font-style":"italic"});
  txt(gr,X(0)-8,Y(0)+14,"O",{"text-anchor":"end",fill:mu,"font-size":12});
  pc.forEach(([a,b],k)=>{ const x1=T[k],x2=T[k+1]; el("line",{x1:X(x1),y1:Y(a*x1+b),x2:X(x2),y2:Y(a*x2+b),stroke:col(segCol(k)),"stroke-width":4,"stroke-linecap":"round"},gr); });
  const cx=st.x, cy=area(cx);
  el("line",{x1:X(cx),y1:Y(0),x2:X(cx),y2:Y(cy),stroke:col("--tri"),"stroke-width":1.5,"stroke-dasharray":"4 4"},gr);
  el("line",{x1:X(0),y1:Y(cy),x2:X(cx),y2:Y(cy),stroke:col("--tri"),"stroke-width":1.5,"stroke-dasharray":"4 4"},gr);
  el("circle",{cx:X(cx),cy:Y(cy),r:7,fill:col("--tri"),stroke:col("--paper"),"stroke-width":2.5},gr);
  const right=X(cx)>GW-150;
  txt(gr,X(cx)+(right?-12:12),Y(cy)-12,`(${fmt(cx)}, ${fmt(cy)})`,{"text-anchor":right?"end":"start",fill:col("--tri"),"font-size":13,"font-weight":700,"paint-order":"stroke",stroke:col("--paper"),"stroke-width":4});
}

function drawFormulas(){
  const T=times(), pc=pieces(), k=section(st.x), S=segs();
  $("formulas").innerHTML=pc.map((p,i)=>{ const c=col(segCol(i));
    return `<div class="frow ${i===k?"on":""}" style="color:${c}">
      <span class="tag" style="background:${c}">${S[i].name}上</span>
      <span class="eq">${linHTML(p[0],p[1])}</span>
      <span class="dom">${fracHTML(T[i])} ≦ ${X_} ≦ ${fracHTML(T[i+1])}</span></div>`; }).join("");
  if (S.some(g=>Math.abs(g.len-Math.round(g.len))>1e-6))
    $("formulas").innerHTML+=`<p class="note">斜辺の長さが整数にならないため、一部の数は小数（およその値）で表示しています。縦3・横4のように3:4:5になる長さにすると、きれいな数になります。</p>`;
}

// ---------- settings UI ----------
function letters(){ return st.shape==="rect"?["A","B","C","D"]:["A","B","C"]; }
function buildSettings(){
  const G=geom(), L=letters();
  $("orientBox").hidden = st.shape!=="tri";
  [...$("orient").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.r===st.triR));
  // names by screen position
  const order=["TL","TR","BL","BR"].filter(p=>Object.values(G.pos).includes(p));
  $("names").innerHTML=order.map(p=>{
    const l=Object.keys(G.pos).find(k=>G.pos[k]===p);
    const tag = G.right===l ? "（直角）" : "";
    return `<label>${POSNAME[p]}${tag} <select data-pos="${p}">${L.map(o=>`<option ${o===l?"selected":""}>${o}</option>`).join("")}</select></label>`;
  }).join("");
  // side names
  const c=G.cycle; let vn="", hn="";
  for(let i=0;i<c.length;i++){ const a=c[i], b=c[(i+1)%c.length], p=G.pts[a], q=G.pts[b];
    if(!vn && Math.abs(p[0]-q[0])<EPS) vn=[a,b].sort().join("");
    else if(!hn && Math.abs(p[1]-q[1])<EPS) hn=[a,b].sort().join(""); }
  $("hName").textContent=`縦（${vn}）`; $("wName").textContent=`横（${hn}）`;
  // route
  $("start").innerHTML=L.map(o=>`<option ${o===st.start?"selected":""}>${o}</option>`).join("");
  const n=c.length;
  $("edges").innerHTML=Array.from({length:n},(_,i)=>i+1).map(e=>`<option value="${e}" ${e===st.edges?"selected":""}>${e}${e===n?"（1周）":""}</option>`).join("");
  const routeText=d=>{ const i0=c.indexOf(st.start), out=[]; for(let j=0;j<=st.edges;j++) out.push(c[((i0+d*j)%n+n)%n]); return out.join(" → "); };
  $("dir").innerHTML=[1,-1].map(d=>`<button data-d="${d}" aria-pressed="${d===st.dir}">${routeText(d)}</button>`).join("");
  // triangle pairs
  const pairs=[]; for(let i=0;i<L.length;i++) for(let j=i+1;j<L.length;j++) pairs.push([L[i],L[j]]);
  $("tri").innerHTML=pairs.map(p=>`<button data-p="${p.join("")}" aria-pressed="${p.join("")===[...st.pair].sort().join("")}">△${p[0]}${p[1]}P</button>`).join("");
}
function shapeName(){ return st.shape==="rect" ? `長方形${geom().cycle.join("")}` : `直角三角形${[...geom().cycle].sort().join("")}（∠${geom().right}＝90°）`; }

function render(){
  const T=times(), xi=$("x"); xi.max=T.at(-1); xi.value=st.x;
  const R=routeLetters();
  $("lead").innerHTML=`${shapeName()}の辺上を、点Pが${R[0]}を出発して ${R.slice(1).join(" → ")} の順に動きます。${X_} 秒後の三角形の面積を ${Y_} cm² として、図・式・グラフを同時に見られます。点Pは図の中で直接ドラッグできます。`;
  $("hv").textContent=st.h; $("wv").textContent=st.w;
  $("xv").textContent=fmt(st.x); $("yv").textContent=fmt(area(st.x));
  const k=section(st.x), wh=$("where"); wh.textContent=`辺${segs()[k].name}上`; wh.style.background=col(segCol(k));
  $("explain").innerHTML="<b>いま：</b>"+explainHTML(st.x);
  $("fPanel").hidden=!$("showF").checked; $("gPanel").hidden=!$("showG").checked;
  drawFig(); drawGraph(); drawFormulas();
}
function setX(x){ st.x=Math.min(Math.max(x,0),times().at(-1)); render(); }
function refresh(){ buildSettings(); setX(st.x); }

$("h").addEventListener("input",e=>{st.h=+e.target.value; setX(st.x);});
$("w").addEventListener("input",e=>{st.w=+e.target.value; setX(st.x);});
$("x").addEventListener("input",e=>{stop(); setX(+e.target.value);});
$("speed").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  [...$("speed").children].forEach(c=>c.setAttribute("aria-pressed",c===b)); st.v=+b.dataset.v; setX(st.x); });
$("shape").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  [...$("shape").children].forEach(c=>c.setAttribute("aria-pressed",c===b));
  stop(); st.shape=b.dataset.s; Object.assign(st,JSON.parse(JSON.stringify(DEF[st.shape]))); st.x=Math.min(st.x,times().at(-1)); refresh(); });
$("orient").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; st.triR=b.dataset.r; refresh(); });
$("names").addEventListener("change",e=>{
  const sel=e.target; const pos=sel.dataset.pos, nl=sel.value, G=geom();
  const old=Object.keys(G.pos).find(k=>G.pos[k]===pos);
  if (st.shape==="rect"){ const other=Object.keys(st.rectL).find(k=>st.rectL[k]===nl); st.rectL[other]=old; st.rectL[pos]=nl; }
  else { const role=Object.keys(st.triL).find(r=>st.triL[r]===old), other=Object.keys(st.triL).find(r=>st.triL[r]===nl); st.triL[other]=old; st.triL[role]=nl; }
  refresh(); });
$("start").addEventListener("change",e=>{ st.start=e.target.value; refresh(); });
$("edges").addEventListener("change",e=>{ st.edges=+e.target.value; refresh(); });
$("dir").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; st.dir=+b.dataset.d; refresh(); });
$("tri").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; st.pair=b.dataset.p.split(""); refresh(); });
["showF","showG","showH"].forEach(id=>$(id).addEventListener("change",render));
$("reset").onclick=()=>{stop(); setX(0);};
$("back").onclick=()=>{stop(); setX(Math.ceil(st.x-1-1e-9));};
$("fwd").onclick=()=>{stop(); setX(Math.floor(st.x+1+1e-9));};

let raf=0,last=0;
function tick(ts){
  if(!st.playing) return;
  const T=times().at(-1), dt=last?ts-last:0; last=ts;
  st.x+=dt*T/7000;
  if(st.x>=T){ st.x=T; render(); stop(); return; }
  render(); raf=requestAnimationFrame(tick);
}
function stop(){ st.playing=false; cancelAnimationFrame(raf); $("play").textContent="▶ 再生"; }
$("play").onclick=()=>{
  if(st.playing){ stop(); return; }
  if(st.x>=times().at(-1)-1e-9) st.x=0;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ setX(st.x+1); return; }
  st.playing=true; last=0; $("play").textContent="⏸ 停止"; raf=requestAnimationFrame(tick);
};
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
refresh();
})();
</script>
