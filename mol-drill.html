<div class="wrap">
<header>
  <div>
    <div class="eyebrow">化学基礎・物質量</div>

</header>

<div class="panel settings">
  <div>
    <div class="lbl">出題範囲（タップで切りかえ）</div>

  </div>
  <div class="srow">

<p class="hint" style="margin-top:24px">答えは有効数字2けた程度でOK（±2%まで正解）。大きな数は「□ × 10<sup>□</sup>」の形で入力します。H=1, C=12, N=14, O=16 などの値は問題ごとに表示されます。</p>
</div>

<script>
(function(){
var NA=6.0e23;
var AW={H:1,He:4,C:12,N:14,O:16,Na:23,Mg:24,Al:27,S:32,Cl:35.5,Ca:40,Fe:56,Cu:64,Zn:65};
var S={
 H2:{f:"H₂",n:"水素",c:{H:2},gas:1,p:"分子"},
 He:{f:"He",n:"ヘリウム",c:{He:1},gas:1,p:"原子"},
 N2:{f:"N₂",n:"窒素",c:{N:2},gas:1,p:"分子"},
 O2:{f:"O₂",n:"酸素",c:{O:2},gas:1,p:"分子"},
 CO2:{f:"CO₂",n:"二酸化炭素",c:{C:1,O:2},gas:1,p:"分子"},
 CO:{f:"CO",n:"一酸化炭素",c:{C:1,O:1},gas:1,p:"分子"},
 CH4:{f:"CH₄",n:"メタン",c:{C:1,H:4},gas:1,p:"分子"},
 C3H8:{f:"C₃H₈",n:"プロパン",c:{C:3,H:8},gas:1,p:"分子"},
 NH3:{f:"NH₃",n:"アンモニア",c:{N:1,H:3},gas:1,p:"分子"},
 Cl2:{f:"Cl₂",n:"塩素",c:{Cl:2},gas:1,p:"分子"},
 HCl:{f:"HCl",n:"塩化水素",c:{H:1,Cl:1},gas:1,p:"分子"},
 H2O:{f:"H₂O",n:"水",c:{H:2,O:1},gas:0,p:"分子"},
 C6H12O6:{f:"C₆H₁₂O₆",n:"グルコース",c:{C:6,H:12,O:6},gas:0,p:"分子"},
 H2SO4:{f:"H₂SO₄",n:"硫酸",c:{H:2,S:1,O:4},gas:0,p:"分子"},
 NaCl:{f:"NaCl",n:"塩化ナトリウム",c:{Na:1,Cl:1},gas:0,p:null},
 NaOH:{f:"NaOH",n:"水酸化ナトリウム",c:{Na:1,O:1,H:1},gas:0,p:null},
 CaCO3:{f:"CaCO₃",n:"炭酸カルシウム",c:{Ca:1,C:1,O:3},gas:0,p:null},
 Fe:{f:"Fe",n:"鉄",c:{Fe:1},gas:0,p:"原子"},
 Cu:{f:"Cu",n:"銅",c:{Cu:1},gas:0,p:"原子"},
 Al:{f:"Al",n:"アルミニウム",c:{Al:1},gas:0,p:"原子"},
 Mg:{f:"Mg",n:"マグネシウム",c:{Mg:1},gas:0,p:"原子"},
 Zn:{f:"Zn",n:"亜鉛",c:{Zn:1},gas:0,p:"原子"}
};
function M(k){var s=S[k],m=0;for(var e in s.c)m+=AW[e]*s.c[e];return Math.round(m*10)/10;}
var KEYS=Object.keys(S);
var GAS=KEYS.filter(function(k){return S[k].gas;});
var PART=KEYS.filter(function(k){return S[k].p;});
var MOLS=[0.10,0.20,0.25,0.30,0.40,0.50,0.60,0.75,1.5,2.0,2.5,3.0,4.0,5.0];

var CATS=[
 {id:"num",label:"個数 ⇔ mol"},
 {id:"mass",label:"質量 ⇔ mol"},
 {id:"vol",label:"気体の体積 ⇔ mol"},
 {id:"two",label:"2段階の変換"},
 {id:"atom",label:"分子の中の原子"},
 {id:"rxn",label:"反応式と量"},
 {id:"conc",label:"モル濃度"}
];

function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function nice(x){var r=Number(x.toPrecision(3));return Math.abs(x-r)<=1e-9*Math.max(1,Math.abs(x));}
function pickMol(ok,list){var c=(list||MOLS).filter(function(m){return !ok||ok(m);});return c.length?pick(c):0.5;}
function sci(x){var e=Math.floor(Math.log10(Math.abs(x)));var m=+(x/Math.pow(10,e)).toPrecision(3);if(Math.abs(m)>=10){m=m/10;e++;}var s=Number.isInteger(m)?m.toFixed(1):String(m);return s+"×10<sup>"+e+"</sup>";}
function fmt(x){
  if(x===0)return "0";var a=Math.abs(x);
  if(a>=1e5||a<1e-3)return sci(x);
  if(Number.isInteger(x)&&a>=10)return String(x);
  var p2=x.toPrecision(2);if(Math.abs(+p2-x)<1e-12)return p2.indexOf("e")>-1?String(x):p2;
  return String(+x.toPrecision(3));
}
function name(k){return S[k].n+" <span class=\"f\">"+S[k].f+"</span>";}
function given(kind,mol,k){return kind==="g"?mol*M(k):kind==="L"?mol*22.4:kind==="n"?mol*NA:mol;}
var UNIT={g:"g",L:"L",n:"個",mol:"mol"};
function toMolOp(kind,k){return kind==="g"?"÷"+M(k):kind==="L"?"÷22.4":"÷6.0×10²³";}
function fromMolOp(kind,k){return kind==="g"?"×"+M(k):kind==="L"?"×22.4":"×6.0×10²³";}
function P(kind,val,extra){return {t:"p",k:kind,v:fmt(val)+" "+(extra||UNIT[kind])};}
function O(v){return {t:"o",v:v+" →"};}
function subj(k,kind,val){
  var s=S[k];
  if(kind==="L")return "標準状態で "+fmt(val)+" L の"+name(k);
  if(kind==="n")return name(k)+" の"+s.p+" "+fmt(val)+" 個";
  return name(k)+" "+fmt(val)+" "+UNIT[kind];
}
function ask(k,kind){
  var s=S[k];
  if(kind==="g")return "の質量は何 g か。";
  if(kind==="L")return "は標準状態で何 L か。";
  if(kind==="n")return "に含まれる"+s.p+"は何個か。";
  return "は何 mol か。";
}
function elemVals(keys){var es={};keys.forEach(function(k){for(var e in S[k].c)es[e]=1;});return Object.keys(es).map(function(e){return e+"="+AW[e];}).join(", ");}
function valsLine(keys,kinds){
  var v=[];var ev=elemVals(keys);if(kinds.indexOf("g")>-1||kinds.indexOf("mass")>-1)v.push(ev);
  if(kinds.indexOf("n")>-1)v.push("アボガドロ定数 6.0×10²³ /mol");
  if(kinds.indexOf("L")>-1)v.push("標準状態 22.4 L/mol");
  return v.join("　");
}
function convSteps(k,from,to,mol,fval,tval){
  var f=[];
  if(from!=="mol"){f.push(P(from,fval));f.push(O(toMolOp(from,k)));}
  f.push(P("mol",mol));
  if(to!=="mol"){f.push(O(fromMolOp(to,k)));f.push(P(to,tval));}
  return [f];
}
function oneStep(cat,k,from,to){
  var m=pickMol(function(x){return nice(given(from,x,k))&&nice(given(to,x,k));});
  var fv=given(from,m,k),tv=given(to,m,k);
  return {cat:cat,text:subj(k,from,fv)+" "+ask(k,to),ans:tv,unit:UNIT[to],
    vals:valsLine([k],[from,to]),steps:convSteps(k,from,to,m,fv,tv),
    point:"いったん <b>mol</b> に直してから、目的の単位へ。"};
}

var GEN={
 num:function(){var k=pick(PART);return Math.random()<.5?oneStep("num",k,"mol","n"):oneStep("num",k,"n","mol");},
 mass:function(){var k=pick(KEYS);return Math.random()<.5?oneStep("mass",k,"mol","g"):oneStep("mass",k,"g","mol");},
 vol:function(){var k=pick(GAS);return Math.random()<.5?oneStep("vol",k,"mol","L"):oneStep("vol",k,"L","mol");},
 two:function(){
   var k=pick(PART);var kinds=["g","n"];if(S[k].gas)kinds.push("L");
   var fr=pick(kinds),to=pick(kinds.filter(function(x){return x!==fr;}));
   return oneStep("two",k,fr,to);
 },
 atom:function(){
   var k=pick(["H2O","CO2","NH3","CH4","H2SO4","C6H12O6","C3H8"]);var s=S[k];
   var els=Object.keys(s.c);var E=pick(els);var c=s.c[E];
   if(Math.random()<.5){
     var m=pickMol();
     return {cat:"atom",text:name(k)+" "+fmt(m)+" mol に含まれる "+E+" 原子は何 mol か。",ans:m*c,unit:"mol",vals:"",
       steps:[[P("mol",m,"mol（"+s.f+"）"),O("×"+c),P("mol",m*c,"mol（"+E+"）")]],
       point:s.f+" 1分子に "+E+" 原子は <b>"+c+" 個</b>。だから "+s.f+" 1 mol に "+E+" 原子は <b>"+c+" mol</b>。"};
   }
   var m2=pickMol(function(x){return nice(x*M(k));});var g=m2*M(k);
   return {cat:"atom",text:name(k)+" "+fmt(g)+" g に含まれる "+E+" 原子は何個か。",ans:m2*c*NA,unit:"個",vals:valsLine([k],["g","n"]),
     steps:[[P("g",g),O("÷"+M(k)),P("mol",m2,"mol（"+s.f+"）"),O("×"+c),P("mol",m2*c,"mol（"+E+"）"),O("×6.0×10²³"),P("n",m2*c*NA)]],
     point:s.f+" 1分子に "+E+" 原子は <b>"+c+" 個</b>。分子の mol を原子の mol に直してから個数へ。"};
 },
 rxn:function(){
   var EQ=[
    {eq:"2H₂ + O₂ → 2H₂O",sp:[["H2",2,"L"],["O2",1,"L"],["H2O",2,"R"]]},
    {eq:"CH₄ + 2O₂ → CO₂ + 2H₂O",sp:[["CH4",1,"L"],["O2",2,"L"],["CO2",1,"R"],["H2O",2,"R"]]},
    {eq:"C₃H₈ + 5O₂ → 3CO₂ + 4H₂O",sp:[["C3H8",1,"L"],["O2",5,"L"],["CO2",3,"R"],["H2O",4,"R"]]},
    {eq:"N₂ + 3H₂ → 2NH₃",sp:[["N2",1,"L"],["H2",3,"L"],["NH3",2,"R"]]},
    {eq:"2CO + O₂ → 2CO₂",sp:[["CO",2,"L"],["O2",1,"L"],["CO2",2,"R"]]},
    {eq:"Zn + 2HCl → ZnCl₂ + H₂",sp:[["Zn",1,"L"],["H2",1,"R"]]},
    {eq:"Mg + 2HCl → MgCl₂ + H₂",sp:[["Mg",1,"L"],["H2",1,"R"]]},
    {eq:"CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂",sp:[["CaCO3",1,"L"],["CO2",1,"R"]]}
   ];
   for(var tries=0;tries<50;tries++){
     var q=pick(EQ);var pr=shuffle(q.sp).slice(0,2);var A=pr[0],B=pr[1];
     var kA=pick(["g","mol"].concat(S[A[0]].gas?["L","L"]:["g"]));
     var kB=pick(["g"].concat(S[B[0]].gas?["L","L"]:["g"]).concat(kA==="mol"?[]:["mol"]));
     var ratio=B[1]/A[1];
     var ok=MOLS.filter(function(x){return nice(given(kA,x,A[0]))&&nice(given(kB,x*ratio,B[0]))&&nice(x*ratio);});
     if(!ok.length)continue;
     var mA=pick(ok),mB=mA*ratio,vA=given(kA,mA,A[0]),vB=given(kB,mB,B[0]);
     var verb=function(x){return x[2]==="L"?"反応する":"生成する";};
     var askB=kB==="g"?"何 g か。":kB==="L"?"標準状態で何 L か。":"何 mol か。";
     var f=[];
     if(kA!=="mol"){f.push(P(kA,vA));f.push(O(toMolOp(kA,A[0])));}
     f.push(P("mol",mA,"mol（"+S[A[0]].f+"）"));f.push(O("×"+B[1]+"/"+A[1]));f.push(P("mol",mB,"mol（"+S[B[0]].f+"）"));
     if(kB!=="mol"){f.push(O(fromMolOp(kB,B[0])));f.push(P(kB,vB));}
     return {cat:"rxn",text:"<div class=\"eqn\">"+q.eq+"</div><br>"+subj(A[0],kA,vA)+" が"+verb(A)+"とき、"+verb(B)+" "+name(B[0])+" は"+askB,
       ans:vB,unit:UNIT[kB],vals:valsLine([A[0],B[0]],[kA,kB]),steps:[f],
       point:"係数の比 ＝ mol の比。"+S[A[0]].f+" : "+S[B[0]].f+" ＝ <b>"+A[1]+" : "+B[1]+"</b>"};
   }
   return GEN.mass();
 },
 conc:function(){
   var sol=pick(["NaOH","NaCl","C6H12O6","H2SO4","HCl"]);var Mm=M(sol);var f=S[sol].f;
   var V=pick([100,200,250,500]);var CS=[0.10,0.20,0.25,0.50,1.0,2.0];
   var v=pick(["a","b","c","d"]);
   var c,mol;
   if(v==="a"||v==="c"){
     var okc=CS.filter(function(x){return nice(x*V/1000*Mm);});c=okc.length?pick(okc):0.10;mol=c*V/1000;var g=mol*Mm;
     if(v==="a")return {cat:"conc",text:name(sol)+" "+fmt(g)+" g を水に溶かして "+V+" mL にした。この水溶液のモル濃度は何 mol/L か。",ans:c,unit:"mol/L",vals:elemVals([sol]),
       steps:[[P("g",g),O("÷"+Mm),P("mol",mol)],[{t:"p",k:"v",v:V+" mL"},O("÷1000"),{t:"p",k:"v",v:fmt(V/1000)+" L"}],[P("mol",mol),O("÷ "+fmt(V/1000)+" L"),{t:"p",k:"c",v:fmt(c)+" mol/L"}]],
       point:"モル濃度 ＝ <b>溶質の mol ÷ 溶液の L</b>。mL は 1000 で割って L に。"};
     return {cat:"conc",text:fmt(c)+" mol/L の "+name(sol)+" 水溶液を "+V+" mL つくるには、"+f+" は何 g 必要か。",ans:g,unit:"g",vals:elemVals([sol]),
       steps:[[{t:"p",k:"c",v:fmt(c)+" mol/L"},O("× "+fmt(V/1000)+" L"),P("mol",mol),O("×"+Mm),P("g",g)]],
       point:"溶質の mol ＝ <b>モル濃度 × 溶液の L</b>。そこから g へ。"};
   }
   if(v==="b"){c=pick(CS);mol=c*V/1000;
     return {cat:"conc",text:fmt(c)+" mol/L の "+name(sol)+" 水溶液 "+V+" mL に含まれる "+f+" は何 mol か。",ans:mol,unit:"mol",vals:"",
       steps:[[{t:"p",k:"v",v:V+" mL"},O("÷1000"),{t:"p",k:"v",v:fmt(V/1000)+" L"}],[{t:"p",k:"c",v:fmt(c)+" mol/L"},O("× "+fmt(V/1000)+" L"),P("mol",mol)]],
       point:"溶質の mol ＝ <b>モル濃度 × 溶液の L</b>。"};
   }
   mol=pick([0.050,0.10,0.20,0.25,0.50]);var okd=CS.filter(function(x){var ml=mol/x*1000;return ml>=20&&ml<=2000&&nice(ml);});c=okd.length?pick(okd):0.5;var L=mol/c;
   return {cat:"conc",text:name(sol)+" "+fmt(mol)+" mol を水に溶かして "+fmt(c)+" mol/L の水溶液をつくると、水溶液は何 mL になるか。",ans:L*1000,unit:"mL",vals:"",
     steps:[[P("mol",mol),O("÷ "+fmt(c)+" mol/L"),{t:"p",k:"v",v:fmt(L)+" L"},O("×1000"),{t:"p",k:"v",v:fmt(L*1000)+" mL"}]],
     point:"溶液の L ＝ <b>溶質の mol ÷ モル濃度</b>。最後に mL へ。"};
 }
};

// ---------- state ----------
var st={cats:CATS.map(function(c){return c.id;}),mode:"prac",q:null,answered:false,tot:0,ok:0,streak:0,by:{},queue:[],idx:0,missed:[]};
var $=function(id){return document.getElementById(id);};
var catsEl=$("cats");
CATS.forEach(function(c){
  var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=c.label;b.setAttribute("aria-pressed","true");b.dataset.id=c.id;
  b.addEventListener("click",function(){
    var on=b.getAttribute("aria-pressed")==="true";
    var n=catsEl.querySelectorAll('[aria-pressed="true"]').length;
    if(on&&n===1)return;
    b.setAttribute("aria-pressed",on?"false":"true");
  });
  catsEl.appendChild(b);
});
function setMode(m){st.mode=m;$("mPrac").setAttribute("aria-pressed",m==="prac");$("mTest").setAttribute("aria-pressed",m==="test");}
$("mPrac").addEventListener("click",function(){setMode("prac");});
$("mTest").addEventListener("click",function(){setMode("test");});
$("start").addEventListener("click",begin);

function begin(){
  st.cats=[].map.call(catsEl.querySelectorAll('[aria-pressed="true"]'),function(b){return b.dataset.id;});
  st.tot=0;st.ok=0;st.streak=0;st.by={};st.missed=[];st.idx=0;
  if(st.mode==="test"){var q=[];var cs=shuffle(st.cats);for(var i=0;i<10;i++)q.push(cs[i%cs.length]);st.queue=shuffle(q);}
  nextQ();
}
var HELP={num:["s9","9章 ×10²³ の計算"],mass:["s8","8章 モル質量の出し方"],vol:["s4","4章 22.4 L"],two:["s5","5章 mol の地図"],atom:["s7","7章 分子の中の原子"],rxn:["s10","10章 反応式と量"],conc:["s11","11章 モル濃度"]};
function helpLink(c){var h=HELP[c];return h?' <a class="help" href="zu-de-wakaru-mol.html#'+h[0]+'" target="_blank" rel="noopener">解説：'+h[1]+' ↗</a>':'';}
function catLabel(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i].label;}
function nextQ(){
  var cat=st.mode==="test"?st.queue[st.idx]:pick(st.cats);
  st.q=GEN[cat]();st.answered=false;render();
}
function statusHTML(){
  if(st.mode==="test"){return "<span>テスト <b>"+Math.min(st.idx+1,10)+"</b> / 10 問目</span><div class=\"prog\"><i style=\"width:"+(st.idx*10)+"%\"></i></div><span>正解 <b>"+st.ok+"</b></span>";}
  return "<span>正解 <b>"+st.ok+"</b> / "+st.tot+"</span><span>連続正解 <b>"+st.streak+"</b></span>";
}
function needSci(x){var a=Math.abs(x);return a>=1e5||(a>0&&a<1e-3);}
function flowHTML(f){return "<div class=\"flow\">"+f.map(function(t){return t.t==="o"?"<span class=\"op\">"+t.v+"</span>":"<span class=\"pill p-"+t.k+"\">"+t.v+"</span>";}).join("")+"</div>";}
var OKSVG='<svg class="mark" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="13" fill="none" stroke="currentColor" stroke-width="4"/></svg>';
var NGSVG='<svg class="mark" viewBox="0 0 34 34" aria-hidden="true"><path d="M7 7 L27 27 M27 7 L7 27" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>';

function render(){
  $("status").innerHTML=statusHTML();
  var q=st.q,sci=needSci(q.ans);
  var inp=sci?'<input id="mant" type="text" inputmode="decimal" autocomplete="off" aria-label="仮数"> × 10<sup><input id="expo" class="exp" type="text" inputmode="numeric" autocomplete="off" aria-label="指数"></sup>':'<input id="val" type="text" inputmode="decimal" autocomplete="off" aria-label="答え">';
  $("main").innerHTML='<div class="card"><span class="tag">'+catLabel(q.cat)+'</span>'+helpLink(q.cat)+'<div class="qtext">'+q.text+'</div>'+(q.vals?'<div class="vals">'+q.vals+'</div>':'')+
   '<form class="ans" id="af"><div class="inp">'+inp+'<span class="u">'+q.unit+'</span></div><button class="btn" type="submit" id="go">採点する</button><button class="btn sub" type="button" id="giveup">答えを見る</button></form><div id="fb"></div></div>';
  $("af").addEventListener("submit",function(e){e.preventDefault();if(st.answered){advance();}else grade(false);});
  $("giveup").addEventListener("click",function(){if(!st.answered)grade(true);});
  var first=$(sci?"mant":"val");if(first)first.focus({preventScroll:true});
}
function readAns(){
  var sci=needSci(st.q.ans);
  if(sci){var m=parseFloat(($("mant").value||"").replace(/,/g,"")),e=parseInt(($("expo").value||"").replace(/[−ー]/g,"-"),10);if(isNaN(m)||isNaN(e))return NaN;return m*Math.pow(10,e);}
  return parseFloat(($("val").value||"").replace(/,/g,""));
}
function grade(gave){
  var u=gave?NaN:readAns();
  if(!gave&&isNaN(u)){$("fb").innerHTML='<p class="hint" style="color:var(--ng)">数字を入力してください'+(needSci(st.q.ans)?'（□ と 10 の右上の数の両方）':'')+'。</p>';return;}
  var q=st.q,ok=!gave&&Math.abs(u-q.ans)<=Math.abs(q.ans)*0.02;
  st.answered=true;st.tot++;if(ok){st.ok++;st.streak++;}else{st.streak=0;st.missed.push({q:q,u:gave?null:u});}
  var b=st.by[q.cat]||(st.by[q.cat]={t:0,o:0});b.t++;if(ok)b.o++;
  var last=st.mode==="test"&&st.idx===9;
  $("fb").innerHTML='<div class="fb '+(ok?"ok":"ng")+'"><div class="verdict">'+(ok?OKSVG+"正解！":NGSVG+(gave?"解き方を確認しよう":"おしい、もう一度確認"))+'</div>'+
    '<div class="correct">答え：<b>'+fmt(q.ans)+' '+q.unit+'</b>'+(!ok&&!gave?'　（あなたの答え：'+fmt(u)+'）':'')+'</div>'+
    '<div class="steps">'+q.steps.map(flowHTML).join("")+'</div><div class="point">'+q.point+'</div>'+
    '<div class="next"><button class="btn" type="button" id="nx">'+(last?"結果を見る":"次の問題")+'</button></div></div>';
  [].forEach.call(document.querySelectorAll("#af input"),function(i){i.readOnly=true;});
  $("go").disabled=true;$("giveup").disabled=true;
  $("nx").addEventListener("click",advance);$("nx").focus({preventScroll:true});
  $("status").innerHTML=statusHTML();
}
function advance(){
  if(st.mode==="test"){st.idx++;if(st.idx>=10){results();return;}}
  nextQ();
}
function results(){
  $("status").innerHTML="";
  var rows=st.cats.filter(function(c){return st.by[c];}).map(function(c){var b=st.by[c];return '<div class="cbar"><span>'+catLabel(c)+'</span><span class="t"><i style="width:'+(b.o/b.t*100)+'%"></i></span><span class="v">'+b.o+'/'+b.t+'</span></div>';}).join("");
  var miss=st.missed.map(function(m){return '<div class="m"><span class="tag">'+catLabel(m.q.cat)+'</span><div style="margin-top:6px">'+m.q.text.replace('<br>','')+'</div><div class="a">正解 <b>'+fmt(m.q.ans)+' '+m.q.unit+'</b>'+(m.u!==null?'　あなた '+fmt(m.u):'　（答えを見た）')+'</div>'+'<div class="steps">'+m.q.steps.map(flowHTML).join("")+'</div></div>';}).join("");
  var msg=st.ok===10?"満点！テスト本番もこの調子で。":st.ok>=8?"よくできました。間違えた問題だけ見直そう。":st.ok>=5?"あと少し。苦手な範囲を練習モードで。":"まずは解説ページで地図を確認してから練習しよう。";
  $("main").innerHTML='<div class="card"><div class="lbl">テスト結果</div><div class="res-score">'+st.ok+'<small> / 10 問正解</small></div><p style="margin-top:6px">'+msg+'</p><div class="cbars">'+rows+'</div>'+
   (miss?'<h3 style="margin-top:22px;font-size:18px">間違えた問題の見直し</h3><div class="miss">'+miss+'</div>':'')+
   '<div class="next" style="margin-top:20px"><button class="btn" type="button" id="again">もう一度テスト</button><button class="btn sub" type="button" id="toPrac">練習モードへ</button></div></div>';
  $("again").addEventListener("click",begin);
  $("toPrac").addEventListener("click",function(){setMode("prac");begin();});
}
begin();
window.__GEN=GEN;
})();
</script>
